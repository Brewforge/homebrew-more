name: pr-validate

on:
  pull_request:
    paths:
      - "Casks/**"
      - "Formula/**"
      - ".github/workflows/pr-validate.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_ENV_HINTS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  validate:
    name: Validate
    runs-on: macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          core: false
          cask: false

      # `setup-homebrew` already taps this checkout and trusts it, which is what
      # makes the tap-qualified names below resolve. Assert that instead of
      # re-tapping, so the action's own cleanup keeps working.
      - name: Check the tap resolves to this checkout
        run: |
          set -euo pipefail
          tap="$(brew --repository brewforge/more)"
          echo "brewforge/more -> $tap"
          test -d "$tap/Formula" -o -d "$tap/Casks"

      # The whole tap, not just the changed files: `brew audit` only sees
      # collisions between a new entry and an existing one when it runs over all
      # of them. These are the checks `brew test-bot --only-tap-syntax` runs,
      # spelled out because test-bot silently no-ops when the tap it runs in is
      # the symlink `setup-homebrew` creates (Tap.from_path does not resolve it).
      - name: Tap syntax
        run: |
          set -euo pipefail
          brew style brewforge/more
          brew readall --aliases --os=all --arch=all brewforge/more
          # `version` is excepted because a formula whose per-arch URLs
          # interpolate `#{version}` makes the explicit `version` look redundant
          # (see Formula/openresearch-cli.rb). Every other audit check applies.
          brew audit --except=installed,version --tap=brewforge/more

      # Two lists come out of the diff against the base branch: every entry the
      # PR touches (fetched, cheap, catches a dead upstream URL) and the subset
      # whose download metadata changed (installed, expensive, pull the whole
      # dependency tree in). A style-only edit must not reinstall a formula.
      - name: Detect changed entries
        id: changed
        run: |
          set -euo pipefail
          base="origin/${GITHUB_BASE_REF:-main}"
          files=$(git diff --name-only --diff-filter=ACMR "$base...HEAD" -- Casks Formula | sort -u)
          echo "Changed files:"
          printf '%s\n' "$files"
          formulae=""
          casks=""
          install_formulae=""
          install_casks=""
          for file in $files; do
            token=$(basename "$file" .rb)
            case "$file" in
              Formula/*) formulae="$formulae $token" ;;
              Casks/*) casks="$casks $token" ;;
            esac
            # Added lines count too: a new entry always carries url/sha256/version.
            metadata=$(git diff -U0 "$base...HEAD" -- "$file" |
              grep -cE '^[+-][^+-].*(url|sha256|version|tag|revision|branch)' || true)
            if [ "$metadata" -gt 0 ]; then
              case "$file" in
                Formula/*) install_formulae="$install_formulae $token" ;;
                Casks/*) install_casks="$install_casks $token" ;;
              esac
            fi
          done
          {
            echo "formulae=${formulae# }"
            echo "casks=${casks# }"
            echo "install_formulae=${install_formulae# }"
            echo "install_casks=${install_casks# }"
          } >> "$GITHUB_OUTPUT"

      # Blocking: proves the URL of every changed entry resolves and that its
      # sha256 still matches the uploaded artifact, which is what bump PRs break.
      # Only the runner's own architecture is verified (macos-latest = arm64).
      - name: Verify downloads
        env:
          FORMULAE: ${{ steps.changed.outputs.formulae }}
          CASKS: ${{ steps.changed.outputs.casks }}
        run: |
          set -euo pipefail
          # Tokens never contain whitespace; the splits are intended.
          # shellcheck disable=SC2086
          for formula in $FORMULAE; do
            brew fetch --formula --retry "brewforge/more/$formula"
          done
          # shellcheck disable=SC2086
          for cask in $CASKS; do
            brew fetch --cask --retry "brewforge/more/$cask"
          done

      # Blocking, and the only check that closes the gap left by fetch/audit: a
      # tarball whose root directory is named differently than `install` expects
      # (or a renamed binary) passes both and only fails here. `brew test` runs
      # the formula's own smoke test; casks have none.
      - name: Install and test
        env:
          FORMULAE: ${{ steps.changed.outputs.install_formulae }}
          CASKS: ${{ steps.changed.outputs.install_casks }}
        run: |
          set -euo pipefail
          if [ -z "${FORMULAE}${CASKS}" ]; then
            echo "No changed entry altered its download metadata; nothing to install."
            exit 0
          fi
          # Tokens never contain whitespace; the splits are intended.
          # shellcheck disable=SC2086
          for formula in $FORMULAE; do
            brew install --formula "brewforge/more/$formula"
            brew test "brewforge/more/$formula"
          done
          # shellcheck disable=SC2086
          for cask in $CASKS; do
            brew install --cask "brewforge/more/$cask"
          done
